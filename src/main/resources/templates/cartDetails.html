<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Your Shopping Cart</title>
</head>
<body>

<h1>Your Shopping Cart</h1>

<!-- Empty Cart Message -->
<div th:if="${#lists.isEmpty(cart.products)}">
    <p>
        Your cart is empty.
        <a th:href="@{/books}">Go shopping!</a>
    </p>
</div>

<!-- Cart Table -->
<table border="1" th:unless="${#lists.isEmpty(cart.products)}">
    <thead>
    <tr>
        <th>Item</th>
        <th>Type</th>
        <th>Price</th>
        <th>Action</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="prod : ${cart.products}">
        <td>
            <div th:if="${prod.productType == 'BookEntity' or prod.productType == 'MagazineEntity'}">
            </div>
        </td>

        <td th:text="${prod.productType}"></td>

        <td th:text="'$' + ${prod.price}"></td>

        <td>
            <a th:href="@{/cart/remove/{id}(id=${prod.id})}">
                Remove
            </a>
        </td>
    </tr>
    </tbody>

    <tfoot>
    <tr>
        <td colspan="2">
            <strong>Total</strong>
        </td>

        <td colspan="2">
            <strong th:text="'$' + ${cart.totalPrice}"></strong>
        </td>
    </tr>
    </tfoot>
</table>

<br/>

<!-- Checkout Button -->
<form th:action="@{/cart/checkout}"
      method="post"
      th:unless="${#lists.isEmpty(cart.products)}">
    <button type="submit">Checkout</button>
</form>

<br/>

<a th:href="@{/books}">Back to Store</a>

</body>
</html>
